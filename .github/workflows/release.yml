name: Release

# release-please turns conventional commits on main into a release pull request; merging it
# tags a GitHub release. The publish job runs in this same workflow because a release made
# with GITHUB_TOKEN does not trigger other workflows. npm trusted publishing (OIDC) must be
# configured on npmjs.com for this repository and this workflow file, release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify before publishing
        run: |
          (cd conformance && sha256sum -c --quiet MANIFEST.sha256)
          npm run lint
          npm run typecheck
          npm test
          npm run test:dist
          npm run check:package
          npm run check:size
      - name: Publish with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
